services:
  - type: web
    name: quoteledger
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_ACCOUNTS
        value: "true"
      - key: PRICE_PROVIDER
        value: public-gold
      - key: DATABASE_URL
        fromDatabase:
          name: quoteledger-db
          property: connectionString

databases:
  - name: quoteledger-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: quoteledger
    user: quoteledger
    ipAllowList: []
