name: Hadj Lakehal Metals quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quoteledger
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: quoteledger
        ports: ["5437:5432"]
        options: >-
          --health-cmd "pg_isready -U quoteledger"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://quoteledger:ci-only-password@127.0.0.1:5437/quoteledger
      TEST_DATABASE_URL: postgresql://quoteledger:ci-only-password@127.0.0.1:5437/quoteledger
      PRICE_PROVIDER: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
